name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip Project
        run: |
          find . -type f -name "*.zip" -exec unzip -q -o {} \;

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Fix All Pubspec and Gradle
        run: |
          echo "Fixing ALL pubspec.yaml files..."
          find . -name "pubspec.yaml" -exec sed -i 's/kavox-arena/kavox_arena/g' {} \;
          find . -name "pubspec.yaml" -exec sed -i 's/Kavox Arena/kavox_arena/g' {} \;
          find . -name "pubspec.yaml" -exec cat {} \; | head -n 20
          
          PROJECT_DIR=$(find . -type f -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project at: $PROJECT_DIR"
          
          echo "Fixing gradle wrapper without flutter create..."
          cd "$PROJECT_DIR"
          mkdir -p android/gradle/wrapper
          # Copy working wrapper from Flutter SDK itself
          cp $FLUTTER_ROOT/packages/flutter_tools/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/ || true
          cp $FLUTTER_ROOT/packages/flutter_tools/gradle/wrapper/gradle-wrapper.properties android/gradle/wrapper/ || true
          chmod +x android/gradlew || true
          ls -lh android/gradle/wrapper/

      - name: Build APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kavox-arena-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
