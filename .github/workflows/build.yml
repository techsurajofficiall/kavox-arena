name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip Project
        run: |
          echo "Listing files:"
          ls -la
          echo "Unzipping all zips..."
          find . -type f -name "*.zip" -exec unzip -q -o {} \;
          echo "After unzip:"
          ls -la
          echo "Finding pubspec.yaml..."
          find . -name "pubspec.yaml"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Build APK
        run: |
          PROJECT_DIR=$(find . -type f -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "PROJECT AT: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release
          echo "APK built at: $PROJECT_DIR/build/app/outputs/flutter-apk/"
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kavox-arena-apk
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
