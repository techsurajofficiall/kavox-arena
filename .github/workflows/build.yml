name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip Project
        run: |
          find . -type f -name "*.zip" -exec unzip -q -o {} \;

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Fix Project Name and Gradle
        run: |
          PROJECT_DIR=$(find . -type f -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          cd "$PROJECT_DIR"
          echo "Fixing pubspec.yaml name..."
          sed -i 's/name: kavox-arena/name: kavox_arena/g' pubspec.yaml
          sed -i 's/name: Kavox Arena/name: kavox_arena/g' pubspec.yaml
          cat pubspec.yaml | head -n 20
          echo "Recreating android folder..."
          rm -rf android/gradle/wrapper
          flutter create --platforms=android . --overwrite
          chmod +x android/gradlew

      - name: Build APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kavox-arena-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
